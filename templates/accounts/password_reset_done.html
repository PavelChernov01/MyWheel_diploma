{% extends 'base/base.html' %}

{% block title %}Письмо отправлено{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
    <div class="card shadow">
        <div class="card-body p-4 text-center">
            <i class="fas fa-envelope fa-4x text-primary mb-3"></i>
            <h3 class="card-title mb-3">Письмо отправлено</h3>

                Мы отправили вам инструкции по восстановлению пароля на email.<br>
                Проверьте свою почту.
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary">Вернуться к входу</a>
        </div>
    </div>
</div>
{% endblock %}
