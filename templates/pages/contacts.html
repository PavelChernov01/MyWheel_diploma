{% extends 'base/base.html' %}

{% block title %}Контакты{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="fw-bold mb-4">Контакты</h1>

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Свяжитесь с нами</h5>
                    <p><i class="fas fa-envelope text-primary"></i> support@mywheel.com</p>
                    <p><i class="fas fa-phone text-primary"></i> +7 (999) 123-45-67</p>
                    <p><i class="fas fa-map-marker-alt text-primary"></i> Москва, Россия</p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Форма обратной связи</h5>
                    <form>
                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="Ваше имя">
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control" placeholder="Email">
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control" rows="4" placeholder="Сообщение"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Отправить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
